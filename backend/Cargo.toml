[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base16ct = { version = "1.0.0", features = ["alloc"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "derive", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }

# oh yeah mega speed
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
